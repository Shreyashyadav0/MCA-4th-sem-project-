name: Publish the learning site

# GitHub Pages serves .css as text/css, which raw.githack does not — raw
# proxies GitHub's raw files as text/plain with nosniff, and browsers then
# refuse to apply the stylesheets at all. This publishes site/ properly.

# Manual only, deliberately. Pages is not enabled on this repository and the
# GitHub App token cannot enable it ("Resource not accessible by integration"),
# so a push trigger just emailed a failure in twelve seconds on every push.
#
# To turn publishing on, once:
#   Settings -> Pages -> Source: GitHub Actions
# then either press Run workflow here, or restore the push trigger below:
#   on:
#     push:
#       branches: [main]
#       paths: ["site/**"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the lesson gate before publishing
        run: |
          python site/tools/validate_lessons.py
          python site/tools/embed_sources.py --check

      - name: Explain the failure if Pages is still off
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            echo "::error::Pages is not enabled. Settings -> Pages -> Source: GitHub Actions, then re-run."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
