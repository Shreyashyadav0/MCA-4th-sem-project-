name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Six pushes in a row produced six failure emails. Only the newest run matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The patch version is resolved from the minor pin: a missing exact patch in the
      # runner image is the most common cause of a job that dies in ten seconds.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report the environment
        run: |
          python -VV
          python -m pip --version
          cat .python-version
          git --version

      - name: Install from the lock
        env:
          PIP_USER: "0"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.lock

      - name: Diagnose a failed install
        if: failure()
        env:
          PIP_USER: "0"
        run: |
          echo "--- interpreter ---"
          python -VV
          echo "--- lock file ---"
          cat requirements.lock
          echo "--- resolve, verbosely ---"
          python -m pip install --dry-run --prefer-binary -r requirements.lock -v || true

      - name: Show what was installed
        run: python -m pip list

      - name: Test suite
        env:
          PIP_USER: "0"
        run: python -m pytest -q tests

      - name: Prove the suite needs no network
        env:
          PIP_USER: "0"
        run: python scripts/verify_offline.py

      - name: Gate the lesson ranges
        run: python site/tools/check_ranges.py

      - name: Gate the quiz length tell
        # Exits non-zero while any question's correct option is the unique longest.
        run: python site/tools/check_quiz.py

      - name: Validate the learning site
        # The gate every site wave must pass: lesson schema, ids, quizzes, the
        # manifest/page list agreement and a fresh embedded-source bundle.
        run: python site/tools/validate_lessons.py
