<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try it yourself — AI Code Reviewer</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<body class="tryit-page">
<a class="skip-link" href="#tryit-code">Skip to the editor</a>

<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="index.html">AI Code Reviewer <span>— learning site</span></a>
    <div class="header-actions">
      <a class="btn" id="tryit-back" href="index.html">Back to the lesson</a>
      <button type="button" class="btn" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">Dark mode</button>
    </div>
  </div>
</header>

<main class="tryit">
  <div class="tryit-bar">
    <h1 id="tryit-title">Try it yourself</h1>
    <div class="tryit-actions">
      <button type="button" class="btn btn-run" id="tryit-run">Run</button>
      <button type="button" class="btn" id="tryit-reset">Reset</button>
      <button type="button" class="btn" id="tryit-copy">Copy</button>
    </div>
  </div>

  <div class="split" id="tryit-split">
    <div class="pane pane-left">
      <label class="visually-hidden" for="tryit-code">Code</label>
      <textarea id="tryit-code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
    </div>
    <div class="divider" id="tryit-divider" role="separator" aria-orientation="vertical"
         aria-label="Resize the panes" tabindex="0"></div>
    <div class="pane pane-right">
      <pre id="tryit-output" class="example-output" tabindex="0" role="region" aria-label="Output"></pre>
      <div class="terminal-panel" id="tryit-terminal" hidden></div>
    </div>
  </div>

  <p class="tryit-status" id="tryit-status" role="status" aria-live="polite"></p>
</main>

<script>
  /* The split editor. Everything it needs is already in memory — window.LESSONS
   * carries the snippet, window.PyRun runs it — so file:// needs no fetch. */
  (function () {
    "use strict";

    var C = window.CONTRACTS;
    var original = "";
    var example = null;
    var lesson = null;

    function $(id) {
      return document.getElementById(id);
    }

    function decode(value) {
      try {
        return decodeURIComponent(String(value || "").replace(/\+/g, " "));
      } catch (error) {
        return null; /* a malformed escape is not a value */
      }
    }

    function param(name) {
      var query = String(window.location.search || "").replace(/^\?/, "");
      var pairs = query ? query.split("&") : [];
      for (var i = 0; i < pairs.length; i += 1) {
        var pair = pairs[i].split("=");
        if (decode(pair[0]) === name) {
          var value = decode(pair.slice(1).join("="));
          return value === null ? "" : value;
        }
      }
      return "";
    }

    function lessonById(id) {
      var list = Array.isArray(window.LESSONS) ? window.LESSONS : [];
      for (var i = 0; i < list.length; i += 1) {
        if (String(list[i].id) === String(id)) {
          return list[i];
        }
      }
      return null;
    }

    function terminalCommand(item, code) {
      var body = typeof code === "string" ? code : item.code;
      if (item.lang === "python") {
        return "python - <<'PY'\n" + String(body || "").replace(/\s+$/, "") + "\nPY";
      }
      return String(body || "").trim();
    }

    function setStatus(text) {
      var status = $("tryit-status");
      if (status) {
        status.textContent = text || "";
      }
    }

    function showOutput(text) {
      var output = $("tryit-output");
      var terminal = $("tryit-terminal");
      if (terminal) {
        terminal.hidden = true;
      }
      if (output) {
        output.hidden = false;
        output.textContent = text;
      }
    }

    /* A terminal-tier example has no Run: it shows the command and what it
     * prints, and says why it cannot run here. */
    function showTerminal(item, reason, code) {
      var output = $("tryit-output");
      var terminal = $("tryit-terminal");
      var run = $("tryit-run");
      if (output) {
        output.hidden = true;
      }
      if (run) {
        run.hidden = true;
      }
      if (!terminal) {
        return;
      }
      terminal.hidden = false;
      terminal.innerHTML = "";

      var title = document.createElement("p");
      title.className = "terminal-title";
      title.textContent = "Run it in a terminal, from the repository root";
      terminal.appendChild(title);

      var command = document.createElement("pre");
      command.className = "code terminal-command";
      var commandCode = document.createElement("code");
      commandCode.textContent = terminalCommand(item, code);
      command.appendChild(commandCode);
      terminal.appendChild(command);

      if (item.expected_output) {
        var label = document.createElement("p");
        label.className = "terminal-title";
        label.textContent = "Expected output";
        terminal.appendChild(label);
        var expected = document.createElement("pre");
        expected.className = "code terminal-output";
        var expectedCode = document.createElement("code");
        expectedCode.textContent = item.expected_output;
        expected.appendChild(expectedCode);
        terminal.appendChild(expected);
      }

      var why = document.createElement("p");
      why.className = "terminal-why";
      why.textContent = "Why not in the browser: " + (reason || item.why_not || "this example needs a terminal.");
      terminal.appendChild(why);
    }

    /* Bring Run back — but never for a terminal-tier example, which has no Run
     * by design, and never while a terminal panel is the honest answer. */
    function restoreRun() {
      var button = $("tryit-run");
      var terminal = $("tryit-terminal");
      if (!button) {
        return;
      }
      var tier = example ? example.run_tier || (example.runnable === true ? "browser" : "terminal") : "terminal";
      if (tier === "terminal") {
        showTerminal(example);
        return;
      }
      button.hidden = false;
      button.disabled = false;
      button.textContent = "Run";
      if (terminal) {
        terminal.hidden = true;
      }
    }

    function runCode() {
      var code = $("tryit-code").value;
      var button = $("tryit-run");
      if (button.disabled) {
        return;
      }
      button.disabled = true;
      /* The first run downloads the runtime, so say that rather than "Running…". */
      button.textContent = window.PyRun.isAvailable() && $("tryit-output").textContent ? "Running…" : "Loading Python…";
      setStatus("Running…");

      window.PyRun.run(code, {
        packages: example.packages || [],
        files: example.files || []
      }).then(function (result) {
        button.disabled = false;
        button.textContent = "Run";
        setStatus("");

        if (result.error_kind === "load") {
          showTerminal(
            example,
            "the Python runtime could not be loaded — the page is offline, or the download was blocked.",
            code
          );
          return;
        }
        if (result.error_kind === "setup") {
          showOutput("This example asks for something that does not exist:\n\n" + result.error);
          return;
        }
        if (result.ok) {
          var text = result.stdout;
          if (result.stderr) {
            text += (text ? "\n" : "") + result.stderr;
          }
          showOutput(text || "(no output)");
          return;
        }
        var pane = result.stdout ? result.stdout + "\n" : "";
        if (result.stderr) {
          pane += result.stderr + "\n";
        }
        showOutput(pane + "This is what the error looks like:\n\n" + result.error);
      });
    }

    function copyCode() {
      var button = $("tryit-copy");
      var text = $("tryit-code").value;
      var done = function (ok) {
        if (!ok) {
          /* Select the code so the instruction is true. */
          var field = $("tryit-code");
          field.focus();
          field.select();
        }
        button.textContent = ok ? "Copied" : "Press Ctrl+C";
        window.setTimeout(function () {
          button.textContent = "Copy";
        }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () {
            done(true);
          },
          function () {
            /* Permission refused (file:// often does): fall back to the old way. */
            done(legacyCopy(text));
          }
        );
        return;
      }
      done(legacyCopy(text));
    }

    function legacyCopy(text) {
      var area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try {
        ok = document.execCommand("copy") === true;
      } catch (error) {
        ok = false;
      }
      document.body.removeChild(area);
      return ok;
    }

    function bindSplit() {
      var split = $("tryit-split");
      var divider = $("tryit-divider");
      if (!split || !divider) {
        return;
      }
      var dragging = false;

      var setSplit = function (percent) {
        var clamped = Math.max(20, Math.min(80, percent));
        split.style.setProperty("--split", clamped + "%");
        divider.setAttribute("aria-valuenow", String(Math.round(clamped)));
      };

      divider.setAttribute("aria-valuemin", "20");
      divider.setAttribute("aria-valuemax", "80");
      setSplit(50);

      var stacked = function () {
        return window.matchMedia && window.matchMedia("(max-width: 900px)").matches;
      };

      var vertical = false; /* captured at pointerdown: the axis must not flip mid-drag */

      var fromPointer = function (event) {
        var box = split.getBoundingClientRect();
        var ratio = vertical
          ? (event.clientY - box.top) / box.height
          : (event.clientX - box.left) / box.width;
        setSplit(ratio * 100);
      };

      divider.addEventListener("pointerdown", function (event) {
        dragging = true;
        vertical = stacked();
        divider.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      divider.addEventListener("pointercancel", function () {
        dragging = false;
      });
      divider.addEventListener("lostpointercapture", function () {
        dragging = false;
      });
      divider.addEventListener("pointermove", function (event) {
        if (dragging) {
          fromPointer(event);
        }
      });
      divider.addEventListener("pointerup", function (event) {
        dragging = false;
        divider.releasePointerCapture(event.pointerId);
      });
      divider.addEventListener("keydown", function (event) {
        var current = Number(divider.getAttribute("aria-valuenow")) || 50;
        var back = stacked() ? "ArrowUp" : "ArrowLeft";
        var forward = stacked() ? "ArrowDown" : "ArrowRight";
        if (event.key === back) {
          event.preventDefault();
          setSplit(current - 5);
        } else if (event.key === forward) {
          event.preventDefault();
          setSplit(current + 5);
        }
      });

      var syncOrientation = function () {
        divider.setAttribute("aria-orientation", stacked() ? "horizontal" : "vertical");
      };
      syncOrientation();
      window.addEventListener("resize", syncOrientation);
    }

    function bindTheme() {
      var button = $("theme-toggle");
      var stored = "light";
      try {
        stored = window.localStorage.getItem(C.THEME_KEY) === "dark" ? "dark" : "light";
      } catch (error) {
        stored = "light";
      }
      document.documentElement.setAttribute("data-theme", stored);

      var sync = function () {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        button.textContent = dark ? "Light mode" : "Dark mode";
        button.setAttribute("aria-pressed", dark ? "true" : "false");
        button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      };
      button.addEventListener("click", function () {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        var next = dark ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try {
          window.localStorage.setItem(C.THEME_KEY, next);
        } catch (error) {
          /* storage refused: the page still renders */
        }
        sync();
      });
      sync();
    }

    function boot() {
      bindTheme();
      bindSplit();

      if (!window.PyRun) {
        /* The runner script did not load: say so instead of leaving a dead button. */
        var deadRun = $("tryit-run");
        if (deadRun) {
          deadRun.hidden = true;
        }
        $("tryit-code").value = "";
        $("tryit-code").disabled = true;
        setStatus("The Python runner could not be loaded, so this page cannot run code.");
        return;
      }

      lesson = lessonById(param("id"));
      if (lesson) {
        /* The back link is useful as soon as the lesson is known, even if the
         * example index is wrong. */
        $("tryit-back").href = "lesson.html?id=" + encodeURIComponent(lesson.id);
      }

      var index = Number(param("ex") || "0");
      if (!lesson || !lesson.code_examples || !lesson.code_examples[index]) {
        document.title = "No such example — AI Code Reviewer";
        $("tryit-title").textContent = "No such example";
        $("tryit-code").value = "";
        $("tryit-code").disabled = true;
        $("tryit-run").hidden = true;
        $("tryit-reset").hidden = true;
        $("tryit-copy").hidden = true;
        setStatus("That link does not point at an example in this build of the site.");
        return;
      }

      example = lesson.code_examples[index];
      original = example.code;
      document.title = "Try it — " + lesson.id + " " + lesson.title;
      $("tryit-title").textContent = lesson.id + " · " + (example.caption || "Example " + (index + 1));
      $("tryit-back").href = "lesson.html?id=" + encodeURIComponent(lesson.id);
      $("tryit-code").value = original;

      var tier = example.run_tier || (example.runnable === true ? "browser" : "terminal");
      if (tier === "terminal") {
        showTerminal(example);
      } else if (!window.PyRun.isAvailable()) {
        showTerminal(example, "Python cannot run in this browser right now — it needs a one-time download.");
      }

      $("tryit-run").addEventListener("click", runCode);
      window.addEventListener("online", restoreRun);

      $("tryit-reset").addEventListener("click", function () {
        $("tryit-code").value = original;
        $("tryit-output").textContent = "";
        var tier = example.run_tier || (example.runnable === true ? "browser" : "terminal");
        if (tier === "terminal") {
          showTerminal(example);
        } else {
          /* The runtime may still be down; Run is offered anyway, and pressing it
           * re-shows the fallback if the download is still blocked. */
          restoreRun();
        }
        setStatus("Reset to the original snippet.");
        window.setTimeout(function () {
          setStatus("");
        }, 1800);
      });
      $("tryit-copy").addEventListener("click", copyCode);

      /* Tab indents two spaces rather than leaving the editor; Ctrl-Enter runs. */
      $("tryit-code").addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          /* Tab indents here, so Escape is the documented way out. */
          event.preventDefault();
          $("tryit-output").focus();
          return;
        }
        if (event.key === "Tab" && event.shiftKey) {
          return; /* Shift-Tab leaves the field, as it should */
        }
        if (event.key === "Tab") {
          event.preventDefault();
          var field = event.target;
          var start = field.selectionStart;
          var end = field.selectionEnd;
          field.value = field.value.slice(0, start) + "  " + field.value.slice(end);
          field.selectionStart = field.selectionEnd = start + 2;
        } else if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          var runButton = $("tryit-run");
          if (!runButton.hidden && !runButton.disabled) {
            runCode();
          }
        }
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot, { once: true });
    } else {
      boot();
    }
  })();
</script>
</body>
</html>
